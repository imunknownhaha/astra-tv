name: Signed APK release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate tag and restore signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.ASTRA_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -F "versionName = \"$version\"" app/build.gradle.kts
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/astra-release.jks"
          chmod 600 "$RUNNER_TEMP/astra-release.jks"
      - name: Build signed APK
        env:
          ASTRA_KEYSTORE: ${{ runner.temp }}/astra-release.jks
          ASTRA_STORE_PASSWORD: ${{ secrets.ASTRA_STORE_PASSWORD }}
          ASTRA_KEY_ALIAS: ${{ secrets.ASTRA_KEY_ALIAS }}
          ASTRA_KEY_PASSWORD: ${{ secrets.ASTRA_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease
      - name: Verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "astra-tv-$version.apk"
          sha256sum "astra-tv-$version.apk" > "astra-tv-$version.apk.sha256"
          gh release create "$GITHUB_REF_NAME" "astra-tv-$version.apk" "astra-tv-$version.apk.sha256" --verify-tag --title "Astra TV $version" --notes-file docs/RELEASE_NOTES.md
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/astra-release.jks"
