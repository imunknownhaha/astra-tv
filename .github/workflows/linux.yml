name: Fedora desktop verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  fedora:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - run: dnf -y install git rpm-build python3 python3-gobject gtk3 python3-cryptography python3-ijson python3-defusedxml mpv mpv-libs libglvnd-egl glibc-langpack-en glibc-langpack-de
      - uses: actions/checkout@v4
      - run: PYTHONPATH=desktop python3 -m unittest discover -s desktop/tests -v
      - run: ./desktop/build-rpm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: astra-fedora-rpm
          path: |
            desktop/build/rpm/RPMS/noarch/*.rpm
            desktop/build/rpm/SRPMS/*.src.rpm
